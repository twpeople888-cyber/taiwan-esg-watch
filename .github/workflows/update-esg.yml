
name: ESG Website Update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Check ESG homepage
        run: |
          test -s index.html

      - name: Generate ESG weekly report
        run: |
          python scripts/build_esg.py \
            --input data/weekly_updates.json \
            --site-dir .

      - name: Commit generated reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add reports/

          if git diff --cached --quiet; then
            echo "No report changes to commit."
          else
            git commit -m "Generate ESG weekly report"
            git push
          fi
