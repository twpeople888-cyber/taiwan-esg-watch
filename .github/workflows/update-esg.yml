name: ESG weekly collection and Pages
on:
  schedule:
    - cron: '17 0 * * 5'
  workflow_dispatch:
    inputs:
      refresh_existing:
        description: '重新抓取並更新今日週報（保留舊版備份）'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['scripts/**', 'tests/**', 'data/manual_updates.json', '.github/workflows/update-esg.yml']
permissions:
  contents: read
concurrency:
  group: esg-weekly-pages
  cancel-in-progress: false
jobs:
  build-report:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Collect and build once per issue date
        shell: bash
        env:
          REFRESH_EXISTING: ${{ inputs.refresh_existing || false }}
        run: |
          END=$(TZ=Asia/Taipei date +%F)
          python scripts/collect_esg.py --week-ending "$END" --output "$RUNNER_TEMP/esg-collected.json"
          if [ ! -f "reports/$END.html" ] || [ "$REFRESH_EXISTING" = "true" ]; then
            cp "$RUNNER_TEMP/esg-collected.json" data/weekly_updates.json
            if [ "$REFRESH_EXISTING" = "true" ]; then
              python scripts/build_esg.py --week-ending "$END" --replace-existing
            else
              python scripts/build_esg.py --week-ending "$END"
            fi
          fi
      - name: Commit generated data and reports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/weekly_updates.json reports/ index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Publish official-source ESG weekly report'
            git push
          fi
      - name: Stage entire existing public site
        run: |
          mkdir -p "$RUNNER_TEMP/esg-pages"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/esg-pages"
          rm -rf "$RUNNER_TEMP/esg-pages/.github" "$RUNNER_TEMP/esg-pages/scripts" "$RUNNER_TEMP/esg-pages/tests"
          touch "$RUNNER_TEMP/esg-pages/.nojekyll"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/esg-pages
  deploy:
    needs: build-report
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
